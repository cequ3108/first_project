name: 社區每日盯盤

# GitHub 託管 runner 的 IP 會被 591/CloudFront 擋（HTTP 403），
# 連 r.jina.ai 也會被 Cloudflare 挑戰頁擋。每日 17:00 改由 Cursor 直連寄信。
# 若之後改用自家 IP 的 self-hosted runner，可再打開下面的 schedule。
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAIL_TO: cequ3108@gmail.com
      MAIL_FROM: cequ3108@gmail.com
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fetch dependencies
        run: pip install -r requirements.txt

      - name: Fetch listings, store prices, email report
        run: python3 watch/daily_report.py --publish-issue --send-email --commit

      - name: Push snapshot
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
